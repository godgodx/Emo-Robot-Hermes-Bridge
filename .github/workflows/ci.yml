name: Quality checks

# This workflow only checks the repository. It never commits, pushes, publishes, or deploys.

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run Python tests
        run: python -m unittest discover -s tests -v

      - name: Compile Python sources
        run: python -m compileall -q emo_agent tests

      - name: Validate shell scripts
        run: bash -n install.sh deploy/pi/*.sh

      - name: Run ShellCheck
        run: shellcheck install.sh deploy/pi/*.sh
